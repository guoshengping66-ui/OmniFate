name: Reset Production Data Once

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RESET_PRODUCTION_DATA to permanently clear the production PostgreSQL public schema.
        required: true
        type: string

concurrency:
  group: reset-production-data
  cancel-in-progress: false

jobs:
  reset:
    if: inputs.confirmation == 'RESET_PRODUCTION_DATA'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Reset production data and restore application code
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 20s
          command_timeout: 100s
          script: |
            set -euo pipefail
            cd /opt/OmniFate
            pm2 stop backend 2>/dev/null || true
            cd backend
            /usr/bin/python3.9 - <<'PY'
            import asyncio

            from database.models import Base
            from database.session import engine

            async def reset_database():
                if engine.url.get_backend_name() != "postgresql":
                    raise RuntimeError("Expected PostgreSQL production database")
                try:
                    async with engine.begin() as connection:
                        await connection.run_sync(Base.metadata.drop_all)
                        await connection.run_sync(Base.metadata.create_all)
                finally:
                    await engine.dispose()

            asyncio.run(reset_database())
            PY
            cd ..
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            pm2 start ecosystem.config.js --only backend --update-env
            pm2 save 2>/dev/null || true
            sleep 12
            curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8003/health
