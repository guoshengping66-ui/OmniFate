name: Reset Production Data Once

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RESET_PRODUCTION_DATA to permanently clear the production PostgreSQL public schema.
        required: true
        type: string

concurrency:
  group: reset-production-data
  cancel-in-progress: false

jobs:
  reset:
    if: inputs.confirmation == 'RESET_PRODUCTION_DATA'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Reset production data and restore application code
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 20s
          command_timeout: 100s
          script: |
            set -euo pipefail
            cd /opt/OmniFate
            test -f .env
            set -a
            . ./.env
            set +a
            case "${DATABASE_URL:-}" in
              postgresql*|postgres*) ;;
              *) echo "Expected PostgreSQL DATABASE_URL" >&2; exit 1 ;;
            esac
            pm2 stop backend 2>/dev/null || true
            /usr/bin/python3.9 - <<'PY'
            import asyncio
            import os

            import asyncpg

            database_url = os.environ["DATABASE_URL"].replace("postgresql+asyncpg://", "postgresql://", 1)

            async def reset_database():
                connection = await asyncpg.connect(database_url, timeout=15)
                try:
                    await connection.execute("DROP SCHEMA public CASCADE")
                    await connection.execute("CREATE SCHEMA public")
                    await connection.execute("GRANT ALL ON SCHEMA public TO CURRENT_USER")
                    await connection.execute("GRANT ALL ON SCHEMA public TO public")
                finally:
                    await connection.close()

            asyncio.run(reset_database())
            PY
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            pm2 start ecosystem.config.js --only backend --update-env
            pm2 save 2>/dev/null || true
            sleep 12
            curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8003/health
