name: Recover Backend Safely

on:
  workflow_dispatch:

concurrency:
  group: recover-backend
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Restart backend without rebuilding
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 20s
          command_timeout: 75s
          script: |
            set -eu
            cd /opt/OmniFate
            git fetch origin main
            git reset --hard origin/main
            pm2 delete backend 2>/dev/null || true
            sudo fuser -k 8003/tcp 2>/dev/null || true
            sudo find /opt/OmniFate/backend -name __pycache__ -type d -exec rm -rf {} + 2>/dev/null || true
            pm2 start ecosystem.config.js --only backend --update-env
            pm2 save 2>/dev/null || true
            sleep 12
            curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8003/health
            WEBHOOK_CODE=$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 5 \
              -X POST -H "Content-Type: application/json" -d '{}' \
              http://127.0.0.1:8003/api/payments/webhooks/paddle)
            test "$WEBHOOK_CODE" = "401"
